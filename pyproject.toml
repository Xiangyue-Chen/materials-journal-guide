[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-journal-guide"
version = "0.1.0"
description = "Source-backed journal requirements guide for metallic materials research"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
