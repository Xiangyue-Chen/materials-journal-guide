  journal-materials-science-technology:
    default_article_type: "Research Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "摘要应简洁独立；官网未规定固定上限。"
        advice: "建议 180–250 词，包含材料状态、加工路线、2–3 个定量结果和机制结论。"
        scope: "官网未规定固定上限"
        source_url: "https://www.sciencedirect.com/journal/journal-of-materials-science-and-technology/publish/guide-for-authors"
      manuscript_structure:
        official: "研究稿通常采用 Introduction → Experimental/Materials and Methods → Results and Discussion → Conclusions → Declarations → References。"
        advice: "用 4–6 个编号小节组织；先给工艺和组织，再给性能，最后用多尺度证据解释机制。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/journal-of-materials-science-and-technology/publish/guide-for-authors"
      display_items:
        official: "Research Article 图表总数官网未规定固定上限。"
        advice: "建议 6–8 幅主图和不超过 2 个主表；把批量工艺参数和补充谱图移入 SI。"
        scope: "官网未规定固定上限"
        source_url: "https://www.sciencedirect.com/journal/journal-of-materials-science-and-technology/publish/guide-for-authors"
      panel_labels:
        official: "出版实例使用小写 (a)、(b)、(c) 多分图标识。"
        advice: "固定左上角 (a)、(b)、(c)，保证缩到单栏后仍不小于约 8 pt。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/journal-of-materials-science-and-technology"
      figure_legends:
        official: "caption 需按 panel 解释内容并定义样品、符号、比例尺、误差和统计。"
        advice: "图注明确合金简称对应的完整成分与处理态，首次出现时不要只写 C1/C2。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/journal-of-materials-science-and-technology/publish/guide-for-authors"
      references:
        official: "初投格式可自由但须一致；出版采用按首次出现顺序的方括号编号。"
        advice: "使用 [1]、[2–4]；近 5 年进展与奠基机制文献兼顾，不用综述替代关键原始证据。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/journal-of-materials-science-and-technology/publish/guide-for-authors"
    blueprint:
      - section: "Abstract"
        task: "180–250 词，突出技术推进和机制。"
      - section: "Introduction"
        task: "界定材料技术问题与现有路线局限。"
      - section: "Experimental"
        task: "成分、加工、热处理、表征和统计完整可复现。"
      - section: "Results and Discussion"
        task: "工艺—组织—性能—机制逐层推进。"
      - section: "Conclusions"
        task: "给出可转移的材料设计或工艺窗口。"

  materials-design:
    default_article_type: "Research Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "摘要不超过 250 词，应独立概括目的、方法、主要结果与结论。"
        advice: "写 180–220 词，明确设计变量、制造/加工路线、性能目标和验证结果。"
        scope: "官方硬性"
        source_url: "https://www.sciencedirect.com/journal/materials-and-design/publish/guide-for-authors"
      manuscript_structure:
        official: "研究稿采用 Introduction → Materials and Methods → Results and Discussion → Conclusions → Declarations → References。"
        advice: "把“设计目标—决策变量—制造—验证—机制/模型”作为主线，避免只报告一个优化结果。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-and-design/publish/guide-for-authors"
      display_items:
        official: "Research Article 图表数量官网未规定固定上限。"
        advice: "建议 5–7 幅主图：设计空间、流程、组织、性能、模型解释、基准比较和泛化验证。"
        scope: "官网未规定固定上限"
        source_url: "https://www.sciencedirect.com/journal/materials-and-design/publish/guide-for-authors"
      panel_labels:
        official: "已发表版式使用小写 (a)、(b)、(c) 标识多分图。"
        advice: "统一左上角 (a)、(b)、(c)；模型图和实验图共享同一配色含义。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-and-design"
      figure_legends:
        official: "每幅图有独立 caption，解释 panels、符号、单位、误差、样本量和统计。"
        advice: "设计空间/机器学习图注明确训练测试划分和误差定义；实验图注明确重复与材料状态。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-and-design/publish/guide-for-authors"
      references:
        official: "初投可用任一一致格式；出版使用连续方括号编号。"
        advice: "用 [1]、[2–4]；同时引用材料机理、设计方法和验证基准，避免只引用算法论文。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-and-design/publish/guide-for-authors"
    blueprint:
      - section: "Abstract"
        task: "180–220 词写清设计目标、变量、验证和收益。"
      - section: "Introduction"
        task: "说明现有设计范式为什么不足。"
      - section: "Materials and Methods"
        task: "定义设计空间、制造路径、模型和实验验证。"
      - section: "Results and Discussion"
        task: "由设计决策到组织/性能，再做基准和泛化验证。"
      - section: "Conclusions"
        task: "输出可执行设计规则与边界，不只重复最优值。"

  materials-science-engineering-a:
    default_article_type: "Research Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "摘要少于 250 词，单段概括原因、主要结果和结论。"
        advice: "写 180–220 词，给出材料状态、测试温度/应变速率、强塑性指标和变形/断裂机制。"
        scope: "官方硬性"
        source_url: "https://www.sciencedirect.com/journal/materials-science-and-engineering-a/publish/guide-for-authors"
      manuscript_structure:
        official: "采用编号章节：Introduction → Material/Experimental methods → Results → Discussion → Conclusions → Declarations → References。"
        advice: "把 Results 与 Discussion 分开；Discussion 围绕变形、损伤或断裂机制建立定量闭环。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-science-and-engineering-a/publish/guide-for-authors"
      display_items:
        official: "Research Article 图表总数官网未规定固定上限。"
        advice: "建议 6–8 幅主图：初始组织、应力应变、加工硬化、断口/局部应变、机制证据、模型与验证。"
        scope: "官网未规定固定上限"
        source_url: "https://www.sciencedirect.com/journal/materials-science-and-engineering-a/publish/guide-for-authors"
      panel_labels:
        official: "出版实例以小写 (a)、(b)、(c) 标识分图。"
        advice: "统一左上角 (a)、(b)、(c)；应力应变、加工硬化和 DIC 图采用一致样品颜色。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-science-and-engineering-a"
      figure_legends:
        official: "caption 解释每个 panel、样品状态、测试条件、比例尺、误差和统计。"
        advice: "拉伸图注明确工程/真实应力应变、温度、应变速率、试样数和误差；断口图必须给比例尺。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-science-and-engineering-a/publish/guide-for-authors"
      references:
        official: "初投格式可自由但须一致；出版采用连续方括号编号。"
        advice: "用 [1]、[2–4]；把本构、变形机制和同类合金性能基准分别引用。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/materials-science-and-engineering-a/publish/guide-for-authors"
    blueprint:
      - section: "Abstract"
        task: "180–220 词，量化力学指标并给出机制。"
      - section: "Introduction"
        task: "提出结构材料的具体变形/断裂问题。"
      - section: "Experimental"
        task: "材料历史、试样几何、测试条件和重复数必须完整。"
      - section: "Results"
        task: "组织—曲线—局部变形—断裂证据按顺序呈现。"
      - section: "Discussion + Conclusions"
        task: "用加工硬化、本构或微观机制解释，并说明结构应用边界。"

  scripta-materialia:
    default_article_type: "Regular Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "摘要最多 150 词。"
        advice: "写 120–150 词，只保留一个问题、一个方法组合、2 个关键定量结果和一个机制结论。"
        scope: "官方硬性"
        source_url: "https://www.sciencedirect.com/journal/scripta-materialia/publish/guide-for-authors"
      manuscript_structure:
        official: "Regular Article 为短篇 Letter 体例，主文约 2500 词；采用 Abstract → 简短 Introduction → Results and Discussion → Conclusions → References。"
        advice: "围绕单一发现写 4–5 个紧凑部分；不做长综述，不把完整项目压缩进一篇短稿。"
        scope: "官方硬性"
        source_url: "https://www.sciencedirect.com/journal/scripta-materialia/publish/guide-for-authors"
      display_items:
        official: "Regular Article 主图最多 5 幅。"
        advice: "最佳结构是 4–5 幅图：问题/材料状态、核心现象、机制证据、对照/验证、简洁模型。"
        scope: "官方硬性"
        source_url: "https://www.sciencedirect.com/journal/scripta-materialia/publish/guide-for-authors"
      panel_labels:
        official: "已发表 Scripta Materialia 论文采用小写 (a)、(b)、(c) 分图标识。"
        advice: "统一 (a)、(b)、(c) 左上角；每幅图少做 panel，优先放大关键证据。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/scripta-materialia"
      figure_legends:
        official: "每幅图提供简洁 caption 并解释全部 panels、符号、比例尺和统计。"
        advice: "控制在约 60–130 词；图注越短，越需要图内符号和正文引用完全一致。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/scripta-materialia/publish/guide-for-authors"
      references:
        official: "采用按出现顺序的方括号编号；初投格式保持一致即可。"
        advice: "参考文献只保留直接支撑单一发现的原始论文，避免为完整综述消耗短稿篇幅。"
        scope: "官方惯例"
        source_url: "https://www.sciencedirect.com/journal/scripta-materialia/publish/guide-for-authors"
    blueprint:
      - section: "Abstract"
        task: "≤150 词，明确单一新发现。"
      - section: "Introduction"
        task: "约 350–500 词，快速到达未解问题。"
      - section: "Methods"
        task: "只写复现该发现所需的材料和方法。"
      - section: "Results and Discussion"
        task: "4–5 幅图形成短而完整的证据链。"
      - section: "Conclusions"
        task: "用 1 段说清发现、机制和材料学意义。"

