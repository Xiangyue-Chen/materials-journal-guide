journals:
  nature:
    default_article_type: "Article（物理科学）"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "加粗概要段，理想长度不超过 200 词；采用可被非本领域读者理解的单段叙事。"
        advice: "控制在 170–200 词：2–3 句背景 → 1 句缺口 → 1 句 Here we show → 2–3 句普适意义。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nature/for-authors/formatting-guide"
      manuscript_structure:
        official: "题目 → 作者/单位 → 加粗概要段 → 主文 → 主参考文献 → 图表/图注 → Methods → Data/Code Availability → 文末声明。典型 6 页稿约 2500 词，8 页稿约 4300 词。"
        advice: "正文用 3–4 个结果导向小标题，不单列传统 Introduction；把技术细节移入 Methods，把跨领域意义留在开头和结尾。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nature/for-authors/formatting-guide"
      display_items:
        official: "典型 6 页 Article 配 4 个中等展示项；典型 8 页 Article 配 5–6 个中等展示项（图和表合计）。"
        advice: "金属/高熵合金稿建议 5 幅主图：设计逻辑、组织、机制证据、力学响应、普适性验证；每幅只承担一个中心论点。"
        scope: "官方惯例"
        source_url: "https://www.nature.com/nature/for-authors/formatting-guide"
      panel_labels:
        official: "多分图使用 8 pt、无衬线、直立小写粗体 a、b、c；所有主图位置保持一致。"
        advice: "把 a、b、c 放在每个 panel 左上角；不要混用 (a)、A 或 a)。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nature/for-authors/final-submission"
      figure_legends:
        official: "每条图注先写整图短标题，再逐 panel 说明符号和内容；每图少于 300 词，并定义全部误差线与统计量。"
        advice: "采用“结论式短标题。a，内容；b，内容；c，统计定义”的顺序，让图脱离正文仍可读。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nature/for-authors/formatting-guide"
      references:
        official: "按首次出现顺序编号，文内使用上标编号而非方括号；主文通常最多 50 条，每个编号只列一项。"
        advice: "文内示例：...strength increases¹,²；文末示例：1. Author, A. et al. Title. Journal volume, pages (year)."
        scope: "官方硬性"
        source_url: "https://www.nature.com/nature/for-authors/formatting-guide"
    blueprint:
      - section: "概要段"
        task: "170–200 词写清跨学科背景、关键缺口、Here we show 和普适推进。"
      - section: "主文开端"
        task: "不用传统综述式引言；在约 3 段内把问题、已有瓶颈和本研究策略推到第一张主图。"
      - section: "结果 1–2"
        task: "Fig. 1 建立设计与材料状态；Fig. 2 给出核心性能和关键对照。"
      - section: "结果 3–4"
        task: "用多尺度机制证据闭环，并排除至少一个竞争解释。"
      - section: "收束 + Methods"
        task: "用最后一段回答为何结论可推广；复现实验细节、统计、数据与代码声明放 Methods 之后。"

  science:
    default_article_type: "Research Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "官网未规定固定上限：公开初投稿说明按 Research Article、Report 等稿件类型分别管理，没有一个跨类型通用字数。"
        advice: "Research Article 先按 125–150 词单段准备：背景 1 句、问题 1 句、方法 1 句、定量结果 2–3 句、广泛意义 1 句。"
        scope: "官网未规定固定上限"
        source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript"
      manuscript_structure:
        official: "研究稿通常采用 Title → Abstract → Introduction → Results → Discussion → Materials and Methods → References and Notes → Acknowledgments/Supplementary Materials。"
        advice: "把全文压成一条因果链：科学问题 → 关键观察 → 机制判据 → 广泛结论；Materials and Methods 保证复现，不在 Results 重复步骤。"
        scope: "官方惯例"
        source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript"
      display_items:
        official: "官网未规定固定上限：公开初投稿页没有给 Research Article 与 Report 共用的图表总数。"
        advice: "Research Article 建议 5–6 幅主图；Report 建议 3–4 幅。金属材料稿每图控制 3–6 个 panel，并把补充验证移至 Supplementary Materials。"
        scope: "官网未规定固定上限"
        source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript"
      panel_labels:
        official: "Science 已发表研究论文采用大写 A、B、C 标识分图，图注对应写作 (A)、(B)、(C)。"
        advice: "全稿统一大写粗体 A、B、C，放左上角；正文引用写 Fig. 2A 或 Fig. 2, A and B。"
        scope: "官方惯例"
        source_url: "https://www.science.org/doi/pdf/10.1126/science.1229054"
      figure_legends:
        official: "图号与简短标题置于图注开头；解释所有 panel、符号、误差、样本量和统计检验，使图可独立理解。"
        advice: "图注按“Fig. 1. 一句结论式标题。(A)... (B)... Statistics...”写，实验流程只保留理解图所必需的信息。"
        scope: "官方惯例"
        source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript"
      references:
        official: "参考文献按首次引用顺序连续编号，正文以数字引用；文末置于 References and Notes，并可把必要说明作为编号 notes。"
        advice: "正文使用单一连续编号，不按作者字母排序；提交前重点检查补充材料中的编号是否与主文连续。"
        scope: "官方惯例"
        source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript"
    blueprint:
      - section: "Abstract"
        task: "先写 125–150 词跨学科摘要，用一个定量结论支撑广泛意义。"
      - section: "Introduction"
        task: "约 3–5 段界定普适问题、知识缺口和可证伪假设。"
      - section: "Results"
        task: "用 3–4 个小节对应主图，证据按观察—机制—验证递进。"
      - section: "Discussion"
        task: "比较现有理论、说明边界条件，并明确材料体系之外的启示。"
      - section: "Materials and Methods"
        task: "给出合金制备、表征、力学统计与数据/代码可用性，补充材料只放非核心支撑。"

  nature-communications:
    default_article_type: "Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "无参考文献的摘要约 150 词；新版格式说明要求 150 词或更少。"
        advice: "写 140–150 词：背景/缺口约 45 词，方法约 25 词，关键定量结果约 55 词，意义约 25 词。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/ncomms-formatting-instructions.pdf"
      manuscript_structure:
        official: "主文不超过 5000 词；Introduction 不设小标题，Results 分小标题，随后 Discussion、Methods、References、Data/Code Availability 与声明。"
        advice: "采用 Introduction → Results（3–5 个结果小节）→ Discussion → Methods；不要把 Results 与 Discussion 混写。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/ncomms-submission-guide.pdf"
      display_items:
        official: "Article 最多 10 个展示项（图与表合计）。"
        advice: "建议主文 5–7 幅图，留出 1–2 个表格名额；超过 7 幅时先检查是否有描述性图可移入补充材料。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/ncomms-submission-guide.pdf"
      panel_labels:
        official: "多分图按小写 a、b、c 标注，不再划分 a1、a2 等次级 panel。"
        advice: "标签固定左上角，用 a、b、c；图注对应以“a，”而不是“(a)”开头。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/ncomms-formatting-instructions.pdf"
      figure_legends:
        official: "每图先写可独立阅读的短标题，再说明全部 panels；每条图注最多 350 词。"
        advice: "控制在 120–220 词；逐 panel 定义样品、变量、n、误差线和检验，避免在图注重复完整方法。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/ncomms-formatting-instructions.pdf"
      references:
        official: "参考文献按出现顺序编号；Article 通常最多 70 条，每个编号只列一项并包含文章标题。"
        advice: "正文使用 Nature 编号制；优先保留直接支撑机制和方法的原始研究，综述只用于建立入口。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/ncomms-submission-guide.pdf"
    blueprint:
      - section: "Abstract"
        task: "≤150 词，最后一句明确本工作的材料学推进。"
      - section: "Introduction"
        task: "无小标题；最后一段写研究策略、主要结果和结论。"
      - section: "Results"
        task: "3–5 个有信息量的小标题，每节对应 1–2 幅主图。"
      - section: "Discussion"
        task: "不重复结果，解释机制、局限和可推广范围。"
      - section: "Methods + 声明"
        task: "集中给出制备、表征、统计、Data Availability、Code Availability 和贡献声明。"

  nature-materials:
    default_article_type: "Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "无参考文献摘要不超过 150 词。"
        advice: "控制在 130–150 词，必须同时出现材料设计逻辑、最关键定量结果和一般性机制。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nmat/content"
      manuscript_structure:
        official: "主文不超过 3000 词（不含摘要、Methods、参考文献和图注）；Introduction 不设标题，Results 用主题小标题，Discussion 不设小标题，随后 Online Methods。"
        advice: "用 3 个 Results 小节完成“设计/现象—机制—普适验证”；Discussion 只保留理论推进、边界和未来可检验命题。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nmat/content"
      display_items:
        official: "主文最多 6 个展示项（图与表合计）。"
        advice: "建议 5 幅主图 + 0–1 个关键表；把常规 XRD、重复曲线和参数扫描移入 Extended Data/SI。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nmat/content"
      panel_labels:
        official: "沿用 Nature Portfolio 制作规范：小写粗体 a、b、c，多分图标签位置与字号一致。"
        advice: "统一左上角小写 a、b、c；不要用 A–F 或 (a) 与 a 混排。"
        scope: "官方惯例"
        source_url: "https://www.nature.com/nature/for-authors/final-submission"
      figure_legends:
        official: "每条图注以整图短标题开头，逐 panel 说明并定义符号、统计量与误差线；沿用 Nature Portfolio 图注格式。"
        advice: "每图约 100–180 词；标题说结论，正文说明看到了什么，不在图注讨论意义。"
        scope: "官方惯例"
        source_url: "https://www.nature.com/nature/for-authors/formatting-guide"
      references:
        official: "Article 最多 50 条参考文献；采用 Nature 连续编号制和文内上标引用。"
        advice: "把参考文献预算分成背景 10–15 条、机制比较 20–25 条、方法/数据 10 条左右。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/nmat/content"
    blueprint:
      - section: "Abstract"
        task: "≤150 词，避免堆工艺名，突出材料概念和机制。"
      - section: "Introduction（无标题）"
        task: "约 500–650 词，从材料领域瓶颈收敛到可检验的设计命题。"
      - section: "Results 1"
        task: "Fig. 1–2 证明材料状态与核心性能，不把常规表征当主结论。"
      - section: "Results 2–3"
        task: "Fig. 3–5 给出多尺度机制和跨条件/跨成分验证。"
      - section: "Discussion + Online Methods"
        task: "Discussion 无小标题；Methods 给足复现细节、统计和数据声明。"

  science-advances:
    default_article_type: "Research Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "官网未规定固定上限：公开作者信息页未给一个对所有 Research Article 稳定适用的摘要字数。"
        advice: "建议 150–200 词单段，按背景 → 问题 → 方法 → 2–3 个定量结果 → 意义组织。"
        scope: "官网未规定固定上限"
        source_url: "https://www.science.org/content/page/science-advances-information-authors"
      manuscript_structure:
        official: "已发表 Research Article 通常为 Abstract → Introduction → Results → Discussion → Materials and Methods → Supplementary Materials → References and Notes → Acknowledgments/声明。"
        advice: "用 Introduction、Results、Discussion 分开写；材料制备和算法细节放 Materials and Methods，核心验证不得只在补充材料。"
        scope: "官方惯例"
        source_url: "https://www.science.org/content/page/science-advances-information-authors"
      display_items:
        official: "官网未规定固定上限：作者信息页未公布统一的主图/表总数上限。"
        advice: "建议 5–7 幅主图，每幅 3–6 个 panel；把参数敏感性、重复实验和完整谱图移到 Supplementary Materials。"
        scope: "官网未规定固定上限"
        source_url: "https://www.science.org/content/page/science-advances-information-authors"
      panel_labels:
        official: "Science Advances 已发表研究论文采用大写 A、B、C，图注写作 (A)、(B)、(C)。"
        advice: "主文与补充图统一用大写 A、B、C；避免与坐标轴变量 A、B 冲突。"
        scope: "官方惯例"
        source_url: "https://www.science.org/doi/pdf/10.1126/sciadv.abe4166"
      figure_legends:
        official: "图注以图号和标题开始，并逐项解释 panels、符号、比例尺、样本量、误差与统计检验。"
        advice: "用“Fig. 1. 结论标题。(A)... (B)...”格式；每幅图的统计信息一次写全。"
        scope: "官方惯例"
        source_url: "https://www.science.org/content/page/science-advances-information-authors"
      references:
        official: "采用连续编号的 References and Notes；主文和补充材料共享连续编号，文末按引用顺序排列。"
        advice: "正文按 (1)、(2–4) 的 AAAS 版式准备；不要为补充材料另开一套参考文献编号。"
        scope: "官方惯例"
        source_url: "https://www.science.org/content/page/science-advances-information-authors"
    blueprint:
      - section: "Abstract"
        task: "150–200 词写清推进、证据和影响。"
      - section: "Introduction"
        task: "3–5 段界定问题、现有争议与本文策略。"
      - section: "Results"
        task: "4–6 个小节，以图为骨架展示材料状态、性能、机制和验证。"
      - section: "Discussion"
        task: "联系广泛科学问题，交代局限和适用范围。"
      - section: "Materials and Methods"
        task: "提供可复现流程；把非核心扩展放 Supplementary Materials。"

  communications-materials:
    default_article_type: "Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "Article 摘要不超过 150 词，不列参考文献。"
        advice: "写 130–150 词，最后一句明确对具体材料分支的显著推进。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/commsmat-checklist.pdf"
      manuscript_structure:
        official: "Article 使用 Introduction → Results → Discussion → Methods → References；Results 和 Methods 用主题小标题，并在 Methods 后给 Data Availability。"
        advice: "以 4 个 Results 小节组织：材料设计、组织证据、性能/功能、机制与边界。"
        scope: "官方惯例"
        source_url: "https://www.nature.com/commsmat/submit"
      display_items:
        official: "主文图与表合计最多 10 个。"
        advice: "建议 5–7 幅主图；除非表格承担比较结论，否则优先把配方/参数表放补充材料。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/commsmat-checklist.pdf"
      panel_labels:
        official: "每个 panel 用单个字母标识；Nature Portfolio 实例与制作规范采用小写 a、b、c。"
        advice: "统一小写 a、b、c，置左上角；不使用 a1、a2 二级标号。"
        scope: "官方惯例"
        source_url: "https://www.nature.com/documents/commsmat-checklist.pdf"
      figure_legends:
        official: "每条图注不超过 350 词；先写整图短标题，再逐 panel 描述并定义误差与统计。"
        advice: "把图注控制在 100–200 词，使用 a、b、c 顺序对应，不写“左图/右图”。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/commsmat-checklist.pdf"
      references:
        official: "Article 通常最多 70 条；按正文、表和图中首次出现顺序编号，并按 Communications Materials 样式列出。"
        advice: "正文用连续编号；确保图注中首次出现的文献不会打乱主文编号。"
        scope: "官方硬性"
        source_url: "https://www.nature.com/documents/commsmat-checklist.pdf"
    blueprint:
      - section: "Abstract"
        task: "≤150 词，说明对一个材料专业方向的显著推进。"
      - section: "Introduction"
        task: "建立专业问题、缺口与研究策略。"
      - section: "Results"
        task: "4 个主题小节，依次回答设计、组织、性能和机制。"
      - section: "Discussion"
        task: "说明与现有模型的关系、局限和可推广边界。"
      - section: "Methods + Data Availability"
        task: "给足复现细节、统计、原始数据位置与必要代码信息。"

  advanced-materials:
    default_article_type: "Research Article"
    verified_on: "2026-10-26"
    quick_specs:
      abstract:
        official: "摘要不超过 200 词，使用现在时和非人称写法，不含参考文献；另列 3–7 个关键词。"
        advice: "写 170–200 词：问题和设计原则约 50 词，方法约 25 词，定量结果约 85 词，材料意义约 30 词。"
        scope: "官方硬性"
        source_url: "https://advanced.onlinelibrary.wiley.com/hub/journal/15214095/author-guidelines"
      manuscript_structure:
        official: "Research Article 通常 3000–8000 词；建议包含 Introduction、Main Text、Conclusion，可选 Experimental/Methods，随后 Acknowledgements、References 和 ToC。"
        advice: "采用 Introduction → Results and Discussion（3–5 个主题小节）→ Conclusion → Experimental Section；结论写设计准则，不逐图复述。"
        scope: "官方惯例"
        source_url: "https://advanced.onlinelibrary.wiley.com/hub/journal/15214095/author-guidelines"
      display_items:
        official: "典型 Research Article 含 3–8 个展示项（图、示意图和表合计）。"
        advice: "建议 5–7 个展示项：1 个设计示意、3–5 个数据图、0–1 个比较表；另备 ToC 图。"
        scope: "官方惯例"
        source_url: "https://advanced.onlinelibrary.wiley.com/hub/journal/15214095/author-guidelines"
      panel_labels:
        official: "分图标签用 12 pt 无衬线小写 a、b、c，所有图保持一致并优先放在左上角。"
